<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Прослушивание голоса — Тихий ритм</title>
<style>body{font:17px/1.5 system-ui;background:#f6f4ef;color:#263b35;max-width:850px;margin:40px auto;padding:20px}h1{font-size:32px}button,input,select{font:inherit;padding:10px;border:1px solid #c4cdc7;border-radius:10px;background:white}button{cursor:pointer}header{position:sticky;top:0;background:#f6f4ef;padding:12px 0}audio{width:100%;margin:12px 0}article{padding:16px 0;border-bottom:1px solid #d6ddd7}article.active{background:#e2ece4}small{display:block;color:#52675e}nav{display:flex;gap:8px;flex-wrap:wrap}input{flex:1;min-width:150px}#status{min-height:26px}</style>
<h1>Послушайте голос</h1><p>Marina · Eleven v3 · русский язык. Сначала — записи с вашими замечаниями. Затем послушайте новую поддержку и весь набор. Старые оценки сохранены отдельно; у новых записей — чистый лист.</p>
<header><nav><button id="all">Слушать по порядку</button><button id="stop">Остановить</button><select id="scope" aria-label="Набор записей"><option value="flagged">Ваши замечания</option><option value="new">Новая поддержка</option><option value="changed">Обновлённые формулировки</option><option value="all">Все фразы</option></select><input id="search" aria-label="Найти фразу" placeholder="Найти фразу"><button id="export">Скачать замечания</button></nav><audio controls id="player"></audio><div id="status" role="status"></div></header><main id="list"></main>
<script type="module">
const $=id=>document.getElementById(id), player=$('player');
let notes={};try{notes=JSON.parse(localStorage.getItem('voice-review-notes-2026-09-09-v3')||'{}')}catch{}
let phrases=[], queue=[],current=null,revision={flagged:[],new:[],changed:[]};
function play(p){current=p;player.src=p.path;player.play().catch(()=>{$('status').textContent='Нажмите кнопку воспроизведения.'});$('status').textContent=p.text;document.querySelectorAll('article').forEach(a=>a.classList.toggle('active',a.dataset.id===p.id));}
player.onended=()=>{if(queue.length)play(queue.shift());else $('status').textContent='Прослушивание завершено.'};
player.onerror=()=>{$('status').textContent='Не удалось загрузить запись. '+(current?.text||'');queue=[]};
function visible(){const query=$('search').value.toLowerCase();return phrases.filter(p=>($('scope').value==='all'||revision[$('scope').value].includes(p.id))&&(p.text+' '+p.id).toLowerCase().includes(query))}
function render(){$('list').replaceChildren();for(const p of visible()){const a=document.createElement('article');a.dataset.id=p.id;const t=document.createElement('p');t.textContent=p.text;const id=document.createElement('small');id.textContent=p.id;const b=document.createElement('button');b.textContent='Послушать';b.onclick=()=>{queue=[];play(p)};const s=document.createElement('select');s.setAttribute('aria-label','Оценка: '+p.text);for(const [value,label] of [['','Не проверено'],['ok','Звучит хорошо'],['stress','Неверное ударение'],['pronunciation','Нечёткое произношение'],['tone','Не нравится интонация']]){const o=document.createElement('option');o.value=value;o.textContent=label;s.append(o)}s.value=notes[p.id]||'';s.onchange=()=>{notes[p.id]=s.value;localStorage.setItem('voice-review-notes-2026-09-09-v3',JSON.stringify(notes))};a.append(id,t,b,' ',s);if(revision.flagged.includes(p.id)){const old=document.createElement('button');old.textContent='Старая запись';old.onclick=()=>{queue=[];play({...p,path:'audio/voice-review-before/'+p.id+'.mp3',text:'Старая запись: '+p.text})};a.append(' ',old)}$('list').append(a)}}
$('search').oninput=render;$('scope').onchange=()=>{queue=[];player.pause();render()};$('all').onclick=()=>{queue=[...visible()];if(queue.length)play(queue.shift())};$('stop').onclick=()=>{queue=[];player.pause()};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(phrases.filter(p=>notes[p.id]).map(p=>({id:p.id,text:p.text,assessment:notes[p.id]})),null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='voice-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
try{revision=await(await fetch('content/voice-review-revision.json')).json();const r=await fetch('content/guidance-assets.json');if(!r.ok)throw Error();const index=await r.json();phrases=Object.entries(index.assets).filter(([id])=>/^[a-z_]+\.\d+$/.test(id)).map(([id,p])=>({id,...p}));const first=['functional.02','functional.04',...revision.flagged];phrases.sort((a,b)=>(first.includes(a.id)?first.indexOf(a.id):-1+3)-(first.includes(b.id)?first.indexOf(b.id):-1+3));render();$('status').textContent=revision.flagged.length+' записей с замечаниями · '+phrases.filter(p=>revision.new.includes(p.id)).length+' готовых поддержек · '+phrases.length+' всего'}catch{$('status').textContent='Не удалось загрузить список фраз. Обновите страницу.'}
</script></html>
